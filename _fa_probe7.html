m fastapi import FastAPI, APIRouter\\nrouter = APIRouter(prefix=\\\"/v1\\\", tags=[\\\"v1\\\"])\\n@router.get(\\\"/ping\\\")\\ndef ping(): return {\\\"pong\\\": True}\\napp = FastAPI(); app.include_router(router)\\nr = await TestClient(app).get(\\\"/v1/ping\\\")\\nprint(\\\"apirouter\\\", r.status_code, r.json(), sorted(app.openapi()[\\\"paths\\\"]))\\n\", \"exception_handler\": \"\\nfrom fastapi import FastAPI, HTTPException, Request\\nfrom fastapi.responses import JSONResponse\\napp = FastAPI()\\nclass Missing(Exception):\\n    def __init__(self, what): self.what = what\\n@app.exception_handler(Missing)\\nasync def handle(request: Request, exc: Missing):\\n    return JSONResponse(status_code=404, content={\\\"missing\\\": exc.what})\\n@app.get(\\\"/x\\\")\\ndef x(): raise Missing(\\\"module\\\")\\n@app.get(\\\"/y\\\")\\ndef y(): raise HTTPException(status_code=418, detail=\\\"teapot\\\")\\nc = TestClient(app)\\nr1 = await c.get(\\\"/x\\\"); r2 = await c.get(\\\"/y\\\")\\nprint(\\\"exception_handler\\\", r1.status_code, r1.json(), \\\"|\\\", r2.status_code, r2.json())\\n\", \"middleware\": \"\\nfrom fastapi import FastAPI\\nfrom starlette.middleware.base import BaseHTTPMiddleware\\napp = FastAPI()\\nclass Stamp(BaseHTTPMiddleware):\\n    async def dispatch(self, request, call_next):\\n        resp = await call_next(request); resp.headers[\\\"x-stamp\\\"] = \\\"seen\\\"; return resp\\napp.add_middleware(Stamp)\\n@app.get(\\\"/m\\\")\\ndef m(): return {\\\"ok\\\": True}\\nr = await TestClient(app).get(\\\"/m\\\")\\nprint(\\\"middleware\\\", r.status_code, r.headers.get(\\\"x-stamp\\\"))\\n\"};\nself.onmessage = async function(e){\n  const base = e.data.base;\n  const py = await loadPyodide({indexURL:\"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/\"});\n  py.setStdout({batched:s=>postMessage({t:\"out\",s})});\n  py.setStderr({batched:s=>postMessage({t:\"out\",s:\"ERR \"+s})});\n  await py.loadPackage([\"pydantic\",\"ssl\",\"micropip\"]);\n  py.globals.set(\"__w__\",
