  await py.runPythonAsync("import micropip\nawait micropip.install(list(__w__))");
  py.runPython("\nimport json as _json\n\n# Starlette hands a sync `def` endpoint to a threadpool. There are no threads\n# here, so run it inline. This is the one behaviour that differs from a real\n# server: a blocking call in a `def` endpoint blocks everything.\nasync def _inline(func, *args, **kwargs):\n    return func(*args, **kwargs)\n\nimport starlette.concurrency, fastapi.concurrency, fastapi.routing\nstarlette.concurrency.run_in_threadpool = _inline\nfastapi.concurrency.run_in_threadpool = _inline\nfastapi.routing.run_in_threadpool = _inline\n\n\ndef _drive(coro):\n    \"\"\"Run an ASGI coroutine to completion without an event loop.\n\n    Nothing in a request that never touches real I/O suspends, so one send()\n    carries it to StopIteration. If it does suspend there is no loop to hand\n    it to, and saying so is better than hanging.\n    \"\"\"\n    try:\n        coro.send(None)\n    except StopIteration as stop:\n        return stop.value\n    coro.close()\n    raise RuntimeError(\n        \"This endpoint awaited real I/O (a network call, a sleep), which the \"\n        \"browser sandbox cannot run. Remove the await and try again.\")\n\n\nclass Response:\n    \"\"\"The part of httpx.Response that a FastAPI example actually touches.\"\"\"\n\n    def __init__(self, status_code, headers, content):\n        self.status_code = status_code\n        self.headers = headers\n        self.content = content\n        self.text = content.decode(\"utf-8\", \"replace\")\n\n    def json(self):\n        return _json.loads(self.text)\n\n    def __repr__(self):\n        return \"<Response [%s]>\" % self.status_code\n\n\nclass TestClient:\n    \"\"\"Calls the app through ASGI - the same path a real server would use.\"\"\"\n\n    def __init__(self, app, base_url=\"http://testserver\"):\n        self.app = app\n        self.base_url = base_url\n\n    def request(self, method, url, json=None, content=None, headers=None):\n        path, _, query = url.partition(\"?\")\n        body = b\"\"\n        hdrs = [(b\"host\", b\"testserver\")]\n        if json is not None:\n            body = _json.dumps(json).encode()\n            hdrs.append((b\"content-type\", b\"application/json\"))\n        elif content is not None:\n            body = content if isinstance(content, bytes) else str(content).encode()\n        for key, value in (headers or {}).items():\n            hdrs.append((key.lower().encode(), value.encode()))\n        hdrs.append((b\"content-length\", str(len(body)).encode()))\n\n        scope = {\n            \"type\": \"http\", \"asgi\": {\"version\": \"3.0\", \"spec_version\": \"2.3\"},\n            \"http_version\": \"1.1\", \"method\": method.upper(), \"scheme\": \"http\",\n            \"path\": path, \"raw_path\": path.encode(), \"query_string\": query.encode(),\n            \"root_path\": \"\", \"headers\": hdrs,\n            \"client\": (\"testclient\", 50000), \"server\": (\"testserver\", 80),\n        }\n\n        async def receive():\n            return {\"type\": \"http.request\", \"body\": body, \"more_body\": False}\n\n        messages = []\n\n        async def send(message):\n            messages.append(message)\n\n        _drive(self.app(scope, receive, send))\n\n        status, out_headers, chunks = None, {}, b\"\"\n        for message in messages:\n            if message[\"type\"] == \"http.response.start\":\n                status = message[\"status\"]\n                out_headers = {k.decode(): v.decode()\n                               for k, v in message.get(\"headers\", [])}\n            elif message[\"type\"] == \"http.response.body\":\n                chunks += message.get(\"body\", b\"\")\n        return Response(status, out_headers, chunks)\n\n    def get(self, url, **kw):\n        return self.request(\"GET\", url, **kw)\n\n    def post(self, url, **kw):\n        return self.request(\"POST\", url, **kw)\n\n    def put(self, url, **kw):\n        return self.request(\"PUT\", url, **kw)\n\n    def patch(self, url, **kw):\n        return self.request(\"PATCH\", url, **kw)\n\n    def delete(self, url, **kw):\n        return self.request(\"DELETE\", url, **kw)\n");
  py.runPython("\nimport json as _j\nfrom fastapi import FastAPI, BackgroundTasks, Depends, Header, Cookie, Request\nfrom fastapi.responses import StreamingResponse, PlainTextResponse\nfrom starlette.middleware.base import BaseHTTPMiddleware\n\nresults = {}\n\n# --- 1. dependencies with yield -------------------------------------------\napp = FastAPI()\nlog = []\ndef get_db():\n    log.append(\"open\")\n    try:\n        yield \"session\"\n    finally:\n        log.append(\"close\")\n\n@app.get(\"/dep\")\ndef dep(db: str = Depends(get_db)):\n    return {\"db\": db}\n\nc = TestClient(app)\ntry:\n    r = c.get(\"/dep\")\n    results[\"yield_dependency\"] = (r.status_code, r.json(), log)\nexcept Exception as e:\n    results[\"yield_dependency\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 2. background tasks ---------------------------------------------------\ndone = []\n@app.post(\"/bg\")\ndef bg(tasks: BackgroundTasks):\n    tasks.add_task(done.append, \"ran\")\n    return {\"queued\": True}\ntry:\n    r = c.post(\"/bg\")\n    results[\"background_tasks\"] = (r.status_code, r.json(), done)\nexcept Exception as e:\n    results[\"background_tasks\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 3. headers and cookies ------------------------------------------------\n@app.get(\"/hc\")\ndef hc(x_token: str = Header(default=None), session: str = Cookie(default=None)):\n    return {\"token\": x_token, \"session\": session}\ntry:\n    r = c.request(\"GET\", \"/hc\", headers={\"x-token\": \"abc\", \"cookie\": \"session=xyz\"})\n    results[\"headers_cookies\"] = (r.status_code, r.json())\nexcept Exception as e:\n    results[\"headers_cookies\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 4. streaming response -------------------------------------------------\n@app.get(\"/stream\")\ndef stream():\n    def gen():\n        for i in range(3):\n            yield (\"chunk%d\\n\" % i).encode()\n    return StreamingResponse(gen(), media_type=\"text/plain\")\ntry:\n    r = c.get(\"/stream\")\n    results[\"streaming\"] = (r.status_code, r.text)\nexcept Exception as e:\n    results[\"streaming\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 5. middleware ---------------------------------------------------------\napp2 = FastAPI()\nclass Stamp(BaseHTTPMiddleware):\n    async def dispatch(self, request, call_next):\n        resp = await call_next(request)\n        resp.headers[\"x-stamp\"] = \"seen\"\n        return resp\napp2.add_middleware(Stamp)\n@app2.get(\"/m\")\ndef m():\n    return {\"ok\": True}\ntry:\n    r = TestClient(app2).get(\"/m\")\n    results[\"middleware\"] = (r.status_code, r.headers.get(\"x-stamp\"))\nexcept Exception as e:\n    results[\"middleware\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 6. lifespan -----------------------------------------------------------\nfrom contextlib import asynccontextmanager\nevents = []\n@asynccontextmanager\nasync def lifespan(app):\n    events.append(\"startup\")\n    yield\n    events.append(\"shutdown\")\napp3 = FastAPI(lifespan=lifespan)\n@app3.get(\"/l\")\ndef l():\n    return {\"events\": list(events)}\ntry:\n    msgs = []\n    async def recv_gen():\n        yield {\"type\": \"lifespan.startup\"}\n        yield {\"type\": \"lifespan.shutdown\"}\n    it = recv_gen()\n    async def receive():\n        return await it.__anext__()\n    async def send(m):\n        msgs.append(m)\n    _drive(app3({\"type\": \"lifespan\", \"asgi\": {\"version\": \"3.0\"}}, receive, send))\n    results[\"lifespan\"] = (events, [m[\"type\"] for m in msgs])\nexcept Exception as e:\n    results[\"lifespan\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:140]\n\n# --- 7. async endpoint with asyncio.sleep ----------------------------------\nimport asyncio\n@app.get(\"/slow\")\nasync def slow():\n    await asyncio.sleep(0)\n    return {\"ok\": True}\ntry:\n    r = c.get(\"/slow\")\n    results[\"async_sleep\"] = (r.status_code, r.json())\nexcept Exception as e:\n    results[\"async_sleep\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:120]\n\n# --- 8. openapi ------------------------------------------------------------\ntry:\n    results[\"openapi\"] = sorted(app.openapi()[\"paths\"])\nexcept Exception as e:\n    results[\"openapi\"] = \"FAIL \" + str(e)[:120]\n\nfor k, v in results.items():\n    print(\"%-20s %s\" % (k, v))\n");
