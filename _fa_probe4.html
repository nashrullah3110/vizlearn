<script>
window.OUT=""; window.DONE=false;
const WHEELS = ["/assets/wheels/sniffio-1.3.1-py3-none-any.whl",

 try{
  const py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"});

  py.setStdout({batched:s=>{window.OUT+=s+"\n";document.getElementById('log').textContent+=s+"\n";}});

  await py.runPythonAsync("import micropip\nawait micropip.install(list(__w__))");
  await py.runPythonAsync("\nimport json as _json\n\nasync def _inline(func, *args, **kwargs):\n    return func(*args, **kwargs)\n\nimport starlette.concurrency, fastapi.concurrency, fastapi.routing\nstarlette.concurrency.run_in_threadpool = _inline\nfastapi.concurrency.run_in_threadpool = _inline\nfastapi.routing.run_in_threadpool = _inline\n\n\nclass Response:\n    def __init__(self, status_code, headers, content):\n        self.status_code = status_code\n        self.headers = headers\n        self.content = content\n        self.text = content.decode(\"utf-8\", \"replace\")\n    def json(self):\n        return _json.loads(self.text)\n    def __repr__(self):\n        return \"<Response [%s]>\" % self.status_code\n\n\nclass TestClient:\n    \"\"\"Async ASGI client - every call is awaited.\"\"\"\n    def __init__(self, app):\n        self.app = app\n\n    async def request(self, method, url, json=None, content=None, headers=None):\n        path, _, query = url.partition(\"?\")\n        body = b\"\"\n        hdrs = [(b\"host\", b\"testserver\")]\n        if json is not None:\n            body = _json.dumps(json).encode()\n            hdrs.append((b\"content-type\", b\"application/json\"))\n        elif content is not None:\n            body = content if isinstance(content, bytes) else str(content).encode()\n        for k, v in (headers or {}).items():\n            hdrs.append((k.lower().encode(), v.encode()))\n        hdrs.append((b\"content-length\", str(len(body)).encode()))\n        scope = {\"type\": \"http\", \"asgi\": {\"version\": \"3.0\", \"spec_version\": \"2.3\"},\n                 \"http_version\": \"1.1\", \"method\": method.upper(), \"scheme\": \"http\",\n                 \"path\": path, \"raw_path\": path.encode(), \"query_string\": query.encode(),\n                 \"root_path\": \"\", \"headers\": hdrs,\n                 \"client\": (\"testclient\", 50000), \"server\": (\"testserver\", 80)}\n        async def receive():\n            return {\"type\": \"http.request\", \"body\": body, \"more_body\": False}\n        out = []\n        async def send(m):\n            out.append(m)\n        await self.app(scope, receive, send)\n        status, rh, chunks = None, {}, b\"\"\n        for m in out:\n            if m[\"type\"] == \"http.response.start\":\n                status = m[\"status\"]\n                rh = {k.decode(): v.decode() for k, v in m.get(\"headers\", [])}\n            elif m[\"type\"] == \"http.response.body\":\n                chunks += m.get(\"body\", b\"\")\n        return Response(status, rh, chunks)\n\n    async def get(self, url, **kw):    return await self.request(\"GET\", url, **kw)\n    async def post(self, url, **kw):   return await self.request(\"POST\", url, **kw)\n    async def put(self, url, **kw):    return await self.request(\"PUT\", url, **kw)\n    async def patch(self, url, **kw):  return await self.request(\"PATCH\", url, **kw)\n    async def delete(self, url, **kw): return await self.request(\"DELETE\", url, **kw)\n");
  await py.runPythonAsync("\nfrom fastapi import FastAPI, BackgroundTasks, Depends\nfrom fastapi.responses import StreamingResponse\nfrom starlette.middleware.base import BaseHTTPMiddleware\nimport asyncio\n\nresults = {}\napp = FastAPI()\nlog, done = [], []\n\ndef get_db():\n    log.append(\"open\")\n    try:\n        yield \"session\"\n    finally:\n        log.append(\"close\")\n\n@app.get(\"/dep\")\ndef dep(db: str = Depends(get_db)):\n    return {\"db\": db}\n\n@app.post(\"/bg\")\ndef bg(tasks: BackgroundTasks):\n    tasks.add_task(done.append, \"ran\")\n    return {\"queued\": True}\n\n@app.get(\"/stream\")\ndef stream():\n    def gen():\n        for i in range(3):\n            yield (\"chunk%d \" % i).encode()\n    return StreamingResponse(gen(), media_type=\"text/plain\")\n\n@app.get(\"/slow\")\nasync def slow():\n    await asyncio.sleep(0)\n    return {\"ok\": True}\n\nc = TestClient(app)\n\nfor name, coro in [(\"yield_dependency\", c.get(\"/dep\")),\n                   (\"background_tasks\", c.post(\"/bg\")),\n                   (\"streaming\", c.get(\"/stream\")),\n                   (\"async_sleep\", c.get(\"/slow\"))]:\n    try:\n        r = await coro\n        results[name] = (r.status_code, r.text[:60])\n    except Exception as e:\n        results[name] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:110]\n\nresults[\"yield_teardown\"] = list(log)\nresults[\"bg_ran\"] = list(done)\n\napp2 = FastAPI()\nclass Stamp(BaseHTTPMiddleware):\n    async def dispatch(self, request, call_next):\n        resp = await call_next(request)\n        resp.headers[\"x-stamp\"] = \"seen\"\n        return resp\napp2.add_middleware(Stamp)\n@app2.get(\"/m\")\ndef m():\n    return {\"ok\": True}\ntry:\n    r = await TestClient(app2).get(\"/m\")\n    results[\"middleware\"] = (r.status_code, r.headers.get(\"x-stamp\"))\nexcept Exception as e:\n    results[\"middleware\"] = \"FAIL \" + type(e).__name__ + \": \" + str(e)[:110]\n\nfor k, v in results.items():\n    print(\"%-18s %s\" % (k, v))\n");
  window.DONE=true;
 }catch(e){ document.getElementById('log').textContent += "\nFATAL "+e; window.DONE=true; }
})();
