<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizLearn - Page not found</title>
    <meta name="description" content="That page does not exist on VizLearn. Search every interactive module on AI, Machine Learning, Algorithms and Maths, or head back to the hub.">
    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://vizlearn.in/404.html">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="theme-color" content="#f3f5f6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/vizlearn.css">

    <script>
        (function () {
            const t = localStorage.getItem('theme') || 'light';
            const apply = () => document.body.classList.toggle('light-mode', t === 'light');
            if (document.body) apply(); else document.addEventListener('DOMContentLoaded', apply);
        })();
    </script>

    <style>
        :root {
            --bg-body: #1c1e1f;
            --bg-surface: #242728;
            --bg-glass: #242728;
            --border-subtle: color-mix(in srgb, #eaa94a 26%, transparent);
            --border-glow: color-mix(in srgb, #eaa94a 50%, transparent);
            --accent-primary: #eaa94a;
            --accent-glow: transparent;
            --text-main: #eceef0;
            --text-muted: #b0b6ba;
            --text-inverse: #1c1e1f;
            --card-bg: #242728;
            --card-icon-bg: color-mix(in srgb, #eaa94a 10%, transparent);
            --input-bg: #2c3031;
            --input-focus-bg: color-mix(in srgb, #eaa94a 12%, transparent);
            --grid-color: color-mix(in srgb, #eaa94a 6%, transparent);
        }
        body.light-mode {
            --bg-body: #f3f5f6;
            --bg-surface: #fcfdfd;
            --bg-glass: #fcfdfd;
            --border-subtle: color-mix(in srgb, #8f5410 34%, transparent);
            --accent-primary: #8f5410;
            --accent-glow: transparent;
            --text-main: #22262a;
            --text-muted: #4e565c;
            --text-inverse: #20242a;
            --card-bg: #fcfdfd;
            --card-icon-bg: color-mix(in srgb, #8f5410 10%, transparent);
            --input-bg: #e9ecee;
            --input-focus-bg: color-mix(in srgb, #8f5410 12%, transparent);
            --grid-color: color-mix(in srgb, #8f5410 8%, transparent);
        }
        body {
            font-family: var(--vz-mono);
            background-color: var(--bg-body);
            color: var(--text-main);
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh;
        }
        h1, h2, h3, .brand-font { font-family: var(--vz-mono); letter-spacing: -0.02em; }
        .mono-font { font-family: var(--vz-mono); }
        .glass-header {
            background-color: var(--bg-glass);
            border-bottom: 1px solid var(--border-subtle);
        }
        .code-404 {
            font-family: var(--vz-mono);
            font-size: clamp(4.5rem, 18vw, 9rem);
            line-height: 1;
            font-weight: 700;
            color: var(--accent-primary);
            text-shadow: 0 0 40px var(--accent-glow);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen light-mode">
<script>if(localStorage.getItem("theme")==="dark")document.body.classList.remove("light-mode");</script>

    <header class="glass-header sticky top-0 z-50">
        <div class="flex justify-center py-3 px-4 md:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between w-full max-w-7xl gap-4">
                <a href="/" class="text-2xl font-bold flex-shrink-0 tracking-tight flex items-center gap-3 select-none no-underline" style="color: var(--text-main)">
                    <div class="w-3 h-3 rounded-full bg-green-400 animate-pulse"></div>
                    <span>viz<span style="color: var(--text-muted); font-weight: 300;">learn</span></span>
                </a>

                <div class="search-input-wrapper rounded-full flex items-center w-full max-w-md px-4 py-2.5 mx-auto md:mx-0">
                    <svg class="vz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="text" id="appSearchInput" aria-label="Search all articles" placeholder="Search all articles..." class="bg-transparent text-sm focus:outline-none ml-3 w-full font-sans tracking-wide">
                    <div id="searchDropdown" class="search-dropdown"></div>
                </div>

                <a href="/" class="vz-btn no-underline">Back to hub</a>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-6 py-16 md:py-24 text-center">
        <p class="code-404">404</p>
        <h1 class="text-2xl md:text-3xl font-bold mt-4 mb-3" style="color: var(--text-main)">This page doesn't exist</h1>
        <p class="text-base leading-relaxed mb-10 mx-auto max-w-xl" style="color: var(--text-muted)">
            The link may be out of date, or the module may have been renamed. Search above,
            or start from one of these.
        </p>

        <div id="suggestions" class="vz-steps text-left"></div>

        <p class="mt-12 text-sm" style="color: var(--text-muted)">
            Think something is genuinely broken?
            <a href="https://github.com/AshishJangra27" target="_blank" rel="noopener noreferrer"
               style="color: var(--accent-primary)">Let me know on GitHub</a>.
        </p>
    </main>

    <footer class="w-full py-6 mt-8 border-t" style="border-color: var(--border-subtle); background: var(--bg-surface);">
        <div class="container mx-auto px-6 text-center" style="color: var(--text-muted)">
            <p class="text-[10px] tracking-[0.2em] mono-font uppercase opacity-70">&copy; 2025 VIZLEARN</p>
        </div>
    </footer>

    <script>
        // Suggest a few good entry points, preferring the start of each track.
        document.addEventListener('DOMContentLoaded', () => {
            const slot = document.getElementById('suggestions');
            const path = (window.VIZLEARN_PATH || []).flatMap(s => s.modules);
            const picks = path.slice(0, 6);
            if (!picks.length) { slot.style.display = 'none'; return; }
            slot.innerHTML = picks.map((m, i) => `
                <a href="/${m.path}" class="vz-step">
                    <span class="vz-step-num">${i + 1}</span>
                    <span class="vz-step-text">
                        <span class="vz-step-title">${m.title}</span>
                        <span class="vz-step-cat">${m.category}</span>
                    </span>
                </a>`).join('');
        });
    </script>

    <script src="/assets/modules.js"></script>
    <script src="/assets/search.js"></script>
    <script src="/assets/vizlearn.js"></script>
</body>
</html>
