<script>
window.OUT=""; window.R={}; window.DONE=false;
const PRELUDE = "\nimport json as _json\nasync def _inline(func, *args, **kwargs):\n    return func(*args, **kwargs)\nimport starlette.concurrency, fastapi.concurrency, fastapi.routing\nstarlette.concurrency.run_in_threadpool = _inline\nfastapi.concurrency.run_in_threadpool = _inline\nfastapi.routing.run_in_threadpool = _inline\n\nclass Response:\n    def __init__(self, status_code, headers, content):\n        self.status_code = status_code; self.headers = headers\n        self.content = content; self.text = content.decode(\"utf-8\", \"replace\")\n    def json(self): return _json.loads(self.text)\n    def __repr__(self): return \"<Response [%s]>\" % self.status_code\n\nclass TestClient:\n    def __init__(self, app): self.app = app\n    async def request(self, method, url, json=None, content=None, headers=None):\n        path, _, query = url.partition(\"?\")\n        body = b\"\"; hdrs = [(b\"host\", b\"testserver\")]\n        if json is not None:\n            body = _json.dumps(json).encode(); hdrs.append((b\"content-type\", b\"application/json\"))\n        elif content is not None:\n            body = content if isinstance(content, bytes) else str(content).encode()\n        for k, v in (headers or {}).items(): hdrs.append((k.lower().encode(), v.encode()))\n        hdrs.append((b\"content-length\", str(len(body)).encode()))\n        scope = {\"type\": \"http\", \"asgi\": {\"version\": \"3.0\", \"spec_version\": \"2.3\"},\n                 \"http_version\": \"1.1\", \"method\": method.upper(), \"scheme\": \"http\",\n                 \"path\": path, \"raw_path\": path.encode(), \"query_string\": query.encode(),\n                 \"root_path\": \"\", \"headers\": hdrs,\n                 \"client\": (\"testclient\", 50000), \"server\": (\"testserver\", 80)}\n        async def receive(): return {\"type\": \"http.request\", \"body\": body, \"more_body\": False}\n        out = []\n        async def send(m): out.append(m)\n        await self.app(scope, receive, send)\n        status, rh, chunks = None, {}, b\"\"\n        for m in out:\n            if m[\"type\"] == \"http.response.start\":\n                status = m[\"status\"]; rh = {k.decode(): v.decode() for k, v in m.get(\"headers\", [])}\n            elif m[\"type\"] == \"http.response.body\": chunks += m.get(\"body\", b\"\")\n        return Response(status, rh, chunks)\n    async def get(self, u, **k): return await self.request(\"GET\", u, **k)\n    async def post(self, u, **k): return await self.request(\"POST\", u, **k)\nprint(\"prelude loaded, TestClient is\", TestClient)\n";
const STEPS = {"yield_dependency": "\nfrom fastapi import FastAPI, Depends\napp = FastAPI(); log = []\ndef get_db():\n    log.append(\"open\")\n    try: yield \"session\"\n    finally: log.append(\"close\")\n@app.get(\"/dep\")\ndef dep(db: str = Depends(get_db)): return {\"db\": db}\nr = await TestClient(app).get(\"/dep\")\nprint(\"yield_dependency\", r.status_code, r.json(), log)\n", "background_tasks": "\nfrom fastapi import FastAPI, BackgroundTasks\napp = FastAPI(); done = []\n@app.post(\"/bg\")\ndef bg(tasks: BackgroundTasks):\n    tasks.add_task(done.append, \"ran\"); return {\"queued\": True}\nr = await TestClient(app).post(\"/bg\")\nprint(\"background_tasks\", r.status_code, r.json(), done)\n", "async_sleep": "\nimport asyncio\nfrom fastapi import FastAPI\napp = FastAPI()\n@app.get(\"/slow\")\nasync def slow():\n    await asyncio.sleep(0); return {\"ok\": True}\nr = await TestClient(app).get(\"/slow\")\nprint(\"async_sleep\", r.status_code, r.json())\n", "streaming": "\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\napp = FastAPI()\n@app.get(\"/s\")\ndef s():\n    def gen():\n        for i in range(3): yield (\"c%d \" % i).encode()\n    return StreamingResponse(gen(), media_type=\"text/plain\")\nr = await TestClient(app).get(\"/s\")\nprint(\"streaming\", r.status_code, repr(r.text))\n", "middleware": "\nfrom fastapi import FastAPI\nfrom starlette.middleware.base import BaseHTTPMiddleware\napp = FastAPI()\nclass Stamp(BaseHTTPMiddleware):\n    async def dispatch(self, request, call_next):\n        resp = await call_next(request); resp.headers[\"x-stamp\"] = \"seen\"; return resp\napp.add_middleware(Stamp)\n@app.get(\"/m\")\ndef m(): return {\"ok\": True}\nr = await TestClient(app).get(\"/m\")\nprint(\"middleware\", r.status_code, r.headers.get(\"x-stamp\"))\n"};
const WHEELS = ["/assets/wheels/sniffio-1.3.1-py3-none-any.whl",
 "/assets/wheels/anyio-4.6.2.post1-py3-none-any.whl",
 "/assets/wheels/starlette-0.41.3-py3-none-any.whl",
 "/assets/wheels/fastapi-0.115.6-py3-none-any.whl"];
const log = s => { window.OUT += s + "\n"; document.getElementById('log').textContent += s + "\n"; };
function withTimeout(p, ms, label){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("TIMEOUT")), ms))]);
}
(async()=>{
  const py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"});
  await py.loadPackage(["pydantic","ssl","micropip"]);
  py.setStdout({batched:log}); py.setStderr({batched:s=>log("ERR "+s)});
  py.globals.set("__w__", WHEELS.map(w=>new URL(w, location.href).href));
  await py.runPythonAsync("import micropip\nawait micropip.install(list(__w__))");
  await py.runPythonAsync(PRELUDE);
  for (const [name, code] of Object.entries(STEPS)) {
    try { await withTimeout(py.runPythonAsync(code), 8000, name); window.R[name]="ok"; }
    catch(e){
      const msg = (e && e.message) ? e.message : String(e);
      window.R[name] = "FAIL " + msg.split("\n").filter(l=>l.trim()).slice(-3).join(" | ").slice(0,300);
      log("FAIL " + name + " :: " + window.R[name]);
    }
  }
  window.DONE=true; log("--- finished ---");
})();
</script>
